[project]
name = "s3-qdrant-synchronizer"
version = "2.0.0"
description = "Синхронизация файлов из S3 (MinIO) в Qdrant"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"app/core/config.py" = ["S104"]

[tool.mypy]
# stub-файлы numpy (зависимость qdrant-client) используют синтаксис Python 3.12
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
